<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Viewer - Lead Sharing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }
        
        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 1.1em;
        }
        
        .status {
            display: inline-block;
            padding: 8px 20px;
            background: #10b981;
            color: white;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 15px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        
        .stat-card h3 {
            color: #667eea;
            font-size: 1.2em;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .stat-number {
            font-size: 3em;
            font-weight: bold;
            color: #333;
        }
        
        .stat-label {
            color: #999;
            font-size: 0.9em;
            margin-top: 5px;
        }
        
        .icon {
            font-size: 1.5em;
        }
        
        .table-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        .table-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        th {
            background: #667eea;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }
        
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
        }
        
        .badge-admin {
            background: #fbbf24;
            color: #78350f;
        }
        
        .badge-homeowner {
            background: #3b82f6;
            color: white;
        }
        
        .badge-tradesperson {
            background: #10b981;
            color: white;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }
        
        .error {
            background: #fee;
            color: #c00;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }
        
        .refresh-btn:hover {
            background: #5568d3;
            transform: scale(1.05);
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>≡ƒùä∩╕Å Database Viewer</h1>
            <p>Visual MySQL Database Browser - No Command Line Needed!</p>
            <span class="status" id="status">ΓùÅ Connected to: lead_sharing</span>
            <br>
            <button class="refresh-btn" onclick="loadAllData()">≡ƒöä Refresh Data</button>
        </div>
        
        <div class="stats-grid" id="stats">
            <div class="loading">Loading statistics...</div>
        </div>
        
        <div class="table-section">
            <h2>≡ƒæÑ Users</h2>
            <div id="usersTable" class="loading">Loading users...</div>
        </div>
        
        <div class="table-section">
            <h2>≡ƒÆ╝ Jobs</h2>
            <div id="jobsTable" class="loading">Loading jobs...</div>
        </div>
        
        <div class="table-section">
            <h2>≡ƒôï Leads</h2>
            <div id="leadsTable" class="loading">Loading leads...</div>
        </div>
        
        <div class="table-section">
            <h2>≡ƒôü Categories</h2>
            <div id="categoriesTable" class="loading">Loading categories...</div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:3000/api';
        
        async function loadAllData() {
            loadUsers();
            loadJobs();
            loadStats();
        }
        
        async function loadStats() {
            try {
                const usersRes = await fetch(`${API_BASE}/admin/users`);
                const usersData = await usersRes.json();
                const users = usersData.users || [];
                
                const homeowners = users.filter(u => u.role === 'HOMEOWNER').length;
                const tradespeople = users.filter(u => u.role === 'TRADESPERSON').length;
                const admins = users.filter(u => u.role === 'ADMIN').length;
                
                document.getElementById('stats').innerHTML = `
                    <div class="stat-card">
                        <h3><span class="icon">≡ƒæÑ</span> Total Users</h3>
                        <div class="stat-number">${users.length}</div>
                        <div class="stat-label">Registered users</div>
                    </div>
                    <div class="stat-card">
                        <h3><span class="icon">≡ƒÅá</span> Homeowners</h3>
                        <div class="stat-number">${homeowners}</div>
                        <div class="stat-label">Looking for services</div>
                    </div>
                    <div class="stat-card">
                        <h3><span class="icon">≡ƒöº</span> Tradespeople</h3>
                        <div class="stat-number">${tradespeople}</div>
                        <div class="stat-label">Service providers</div>
                    </div>
                    <div class="stat-card">
                        <h3><span class="icon">≡ƒææ</span> Admins</h3>
                        <div class="stat-number">${admins}</div>
                        <div class="stat-label">System administrators</div>
                    </div>
                `;
            } catch (error) {
                document.getElementById('stats').innerHTML = `
                    <div class="error">Error loading stats: ${error.message}</div>
                `;
            }
        }
        
        async function loadUsers() {
            try {
                const res = await fetch(`${API_BASE}/admin/users`);
                const data = await res.json();
                const users = data.users || [];
                
                if (users.length === 0) {
                    document.getElementById('usersTable').innerHTML = `
                        <div class="empty-state">No users found in database</div>
                    `;
                    return;
                }
                
                const table = `
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Created</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${users.map(user => `
                                <tr>
                                    <td>${user.id || user._id}</td>
                                    <td>${user.name}</td>
                                    <td>${user.email}</td>
                                    <td>
                                        <span class="badge badge-${user.role.toLowerCase()}">
                                            ${user.role}
                                        </span>
                                    </td>
                                    <td>${new Date(user.created_at || user.createdAt).toLocaleDateString()}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
                document.getElementById('usersTable').innerHTML = table;
            } catch (error) {
                document.getElementById('usersTable').innerHTML = `
                    <div class="error">Error loading users: ${error.message}</div>
                `;
            }
        }
        
        async function loadJobs() {
            try {
                const res = await fetch(`${API_BASE}/admin/jobs`);
                const jobs = await res.json();
                
                if (!jobs || jobs.length === 0) {
                    document.getElementById('jobsTable').innerHTML = `
                        <div class="empty-state">No jobs posted yet</div>
                    `;
                    return;
                }
                
                const table = `
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Description</th>
                                <th>Status</th>
                                <th>Budget</th>
                                <th>Created</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${jobs.map(job => `
                                <tr>
                                    <td>${job.id || job._id}</td>
                                    <td>${job.description?.substring(0, 50)}...</td>
                                    <td><span class="badge">${job.status}</span></td>
                                    <td>┬ú${job.budgetMin || 0} - ┬ú${job.budgetMax || 0}</td>
                                    <td>${new Date(job.created_at || job.createdAt).toLocaleDateString()}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
                document.getElementById('jobsTable').innerHTML = table;
            } catch (error) {
                document.getElementById('jobsTable').innerHTML = `
                    <div class="empty-state">No jobs available</div>
                `;
            }
        }
        
        // Load data on page load
        window.onload = loadAllData;
    </script>
</body>
</html>
